<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Profesional - Wrapping & Vinil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #fff;
        }

        header {
           background: linear-gradient(90deg, #000, #1a1a1a);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
        }
         nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00e5ff;
        }

        .galeria {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .galeria img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.4s ease;
            cursor: pointer;
        }

        .galeria img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px #00f2ff;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #000;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .galeria {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
